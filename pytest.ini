[pytest]
testpaths = tests
# --basetemp keeps per-test stores out of the system temp directory, which is
# unset in some sandboxed shells (pytest then falls back to the CWD and litters
# the repo with pytest-of-* folders). It is gitignored.
addopts = -q --basetemp=.pytest-tmp
# pyvis and Streamlit emit deprecation noise from their own internals; surfacing
# it in this project's output would train us to ignore warnings.
filterwarnings =
    ignore::DeprecationWarning
